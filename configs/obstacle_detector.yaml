# nodes/obstacle_detector.py tuning. Every key overrides the node's DEFAULTS;
# docs/obstacle_detection.md explains the pipeline these feed.

# Frames processed per second, on the steady clock. The camera runs at 30;
# 10 is plenty to track walking speed (~1.4 m/s = 14 cm a frame) and keeps
# the node to a fraction of a core on the Orin Nano.
rate_hz: 10.0

# Back-project every Nth pixel in each direction. 4 on 848x480 is ~25k points
# a frame; a person at 4 m is still ~25x60 samples.
stride: 4

# Range crop on raw depth (metres along the optical axis). The D435 is
# unreliable under ~0.3 m and noisy past ~4.5 m; depth_colorizer uses the
# same window.
min_range_m: 0.3
max_range_m: 4.5

# Floor height in base_link. floor_auto re-estimates it every frame from the
# densest z-bin within ±floor_search_m of floor_z_m, so neither the sim's
# base_link offset (from the USD) nor the real camera's (still-unmeasured)
# mount height has to be exact. With too little floor in view it keeps the
# last estimate, and floor_z_m before any.
floor_z_m: 0.0
floor_auto: true
floor_search_m: 0.5
floor_bin_m: 0.02
floor_min_points: 200
floor_smoothing: 0.2        # EMA weight of each new estimate

# Height band above the floor that counts as obstacle. The lower edge drops
# floor noise and the plane's own thickness; the upper keeps ceiling and
# high racking out of a ground robot's way.
min_height_m: 0.08
max_height_m: 2.0

# Clustering: points are binned into cell_m x cell_m columns in x/y and
# columns touching (8-connected) form one obstacle. Two people closer than
# ~2 cells merge; raise min_cell_points if depth speckle makes ghost clusters.
cell_m: 0.10
min_cell_points: 3
min_cluster_points: 30
min_cluster_height_m: 0.10  # cluster top above floor; drops floor-hugging debris

# Tracking (odom frame). A detection joins the nearest predicted track within
# track_gate_m; tracks unseen for track_max_age_s are dropped.
track_gate_m: 0.6
track_max_age_s: 1.0
# Frames before a track may be called moving. 3 let a thin upright blip to
# 0.35 m/s for one frame while turning (live, 2026-10-22); 5 is 0.5 s at 10 Hz,
# far less than a person takes to cross the view.
track_min_hits: 5
velocity_smoothing: 0.4     # EMA weight of each frame's raw velocity
moving_speed_mps: 0.25      # slow walk is ~1 m/s; well above centroid jitter
max_moving_extent_m: 1.5    # longer clusters (shelves, walls) never get a velocity
# Rules for when a centroid's motion counts (can_move in the node has the live
# measurements behind each). Within edge_margin_px of the image's left/right
# edge a cluster is only partly in view; under min_moving_z_extent_m top to
# bottom it is a flat surface seen edge-on. Both slide as the robot turns.
edge_margin_px: 8
min_moving_z_extent_m: 0.3
# A cluster whose farthest point is within range_margin_m of max_range_m is
# cut by the range crop, and driving toward it pulls more of it inside: also
# clipped. And no centroid moves faster than max_obstacle_speed_mps; a bigger
# frame-to-frame jump is a cluster splitting or merging, so the track restarts.
range_margin_m: 0.3
max_obstacle_speed_mps: 3.0

# Large movers. A forklift or pallet jack is ~2.5 m long, past
# max_moving_extent_m, but a long cluster may still move when it is TALL
# (large_mover_min_z_m top to bottom): shelf decks and walls seen edge-on are
# long and flat, and racking long enough to pass this extent is longer still,
# or clipped. Added 2026-11-04 for the forklift test worlds; re-measure the
# false-"moving" table in docs/obstacle_detection.md if either changes.
max_large_mover_extent_m: 3.0
large_mover_min_z_m: 1.2

# Kalman tracker (constant velocity, state x y vx vy in odom). kf_accel_sigma
# is how much a mover may change velocity per second (1 m/s^2: a person
# stopping in a stride, a forklift braking); kf_meas_sigma_m the centroid
# jitter of one frame; kf_init_vel_sigma how fast a new track might be
# moving (a brisk walk); kf_gate_chi2 the association gate on the
# innovation's Mahalanobis distance (9.21 = 99 % for 2 dof), applied with
# track_gate_m above. velocity_smoothing is no longer used: the filter
# averages frames itself.
kf_accel_sigma: 1.0
kf_meas_sigma_m: 0.1
kf_init_vel_sigma: 1.5
kf_gate_chi2: 9.21

# Prediction. pred_horizons_s are the look-ahead points in /<id>/obstacle_tracks
# (`pred`), drawn by the operator view and scored by the simtest `prediction`
# metric. predict_cloud publishes /<id>/predicted_obstacles: each moving
# track's footprint swept pred_cloud_horizon_s along its velocity, a
# local-costmap source (configs/nav2_params.yaml predicted_scan). 1.5 s is
# a ribbon of one stride for a walker and ~3 m for a forklift; longer and
# the marks (lethal, like any costmap obstacle) start to wall off aisles in
# head-on cases. Set predict_cloud: false to compare Nav2 without it.
pred_horizons_s: [0.5, 1.0, 1.5]
predict_cloud: true
pred_cloud_horizon_s: 1.5
pred_cloud_step_s: 0.1
pred_cloud_cell_m: 0.1
pred_cloud_z_m: 0.5          # inside the costmap's obstacle height band
pred_cloud_min_radius_m: 0.25

# The real robot's omni base and head camera, driven from the operator view's Drive
# view (webui/operator_drive.js -> serve.py --drive -> scripts/drive_bridge.py).
# Read by scripts/drive_bridge.py; serve.py only passes the path along.

# The servo bus board the three wheel servos are chained on. XLeRobot puts them on a
# second board (its bus 2, with the right arm); ours shares the arm's board until
# there is a second one, so this is usually the arm's port.
port: /dev/ttyACM0

# Wheel servo ids. XLeRobot numbers them 7/8/9, but on this bus 7 and 8 are already the
# head's pan/tilt (docs/arm.md), so ours start at 9. Check what is really on the bus
# with `scripts/drive_bridge.py scan` and set a new servo with `drive_bridge.py setup`.
wheels:
  base_left_wheel: 9
  base_back_wheel: 10
  base_right_wheel: 11

# XLeRobot / LeKiwi base geometry (lerobot's lekiwi.py _body_to_wheel_raw).
wheel_radius_m: 0.05
base_radius_m: 0.125
# Wheels mounted at these angles (deg) minus 90, in left/back/right order.
wheel_angles_deg: [240, 0, 120]
# Per-wheel ceiling in raw Goal_Velocity steps/s (4096 steps a turn): all three are
# scaled down together past it, so the direction of travel is kept.
max_raw: 3000

# The operator's speed levels (d-pad up/down on the pad), XLeRobot's own three.
# The bridge clamps every command to the fastest level, whatever the page sends.
speed_levels:
  - {xy_mps: 0.1, theta_dps: 30}
  - {xy_mps: 0.2, theta_dps: 60}
  - {xy_mps: 0.3, theta_dps: 90}

# Software ramp on the body velocity. A tall robot on omni wheels tips or skids on a
# step change; 1 m/s^2 still stops from the top speed in 0.3 s.
accel_mps2: 1.0
alpha_dps2: 180

# No command for this long and the wheels are ramped to a stop: a closed tab, a
# dropped Wi-Fi link or a crashed browser must never leave the robot driving.
watchdog_s: 0.3

camera:
  enabled: true
  width: 640
  height: 480
  # Tried in order: a D435 on a USB 2 port can't do 30 fps at 640x480 (docs/jetson.md).
  fps: [30, 15]
  jpeg_quality: 70

# Named stations for task dispatch (pickup shelves / dropoff zones), in the
# `map` frame Nav2 navigates against.
#
# STAGE 1 POSES — deliberately near the robot's spawn point, NOT at the real
# rack row. robot_0 spawns at (-4.5, 4.5), so this strip of floor is provably
# clear (something spawns there every run) and the nav legs are short, which
# makes the pick demo fast to iterate on. Once the whole nav -> pick -> carry
# -> place loop works here, move the stations out to the rack row (roughly
# shelf_a (-4.5, 8.3), zone_b (0.5, 2.0)) for longer, more demo-worthy legs.
#
# Moving them means RE-CAPTURING configs/arm_poses.yaml, since the recorded
# joint angles are only valid for the geometry they were captured against.
# Keeping deck_height_m identical between stages makes that a no-op — worth
# doing deliberately.
#
# ARM REACH, the number that constrains dock_offset_m: summing the URDF link
# origins from `Rotation` to `Fixed_Jaw_tip` gives about 0.50 m of arm fully
# extended. The previous 0.5 m dock_offset was therefore not merely untuned,
# it was unreachable by construction — the robot parked its base a whole
# arm-length from the shelf. Values below are provisional; tune them live with
# the dashboard's arm pad (see configs/arm_poses.yaml's header for the loop).
#
# `prop:` is read only by scripts/spawn_warehouse.py, which authors a shelf at
# that pose so there is actually something at a reachable height to pick from
# (the NVIDIA warehouse's own racks start well above this arm). It is inert
# everywhere else: task_manager.Station reads only kind/pose/dock_offset_m/
# dock_lateral_m, and the dashboard reads only `kind`.

stations:
  shelf_a:
    kind: pickup
    pose: { x: -4.5, y: 5.5, yaw: 1.5708 }   # facing +y, 1 m ahead of spawn
    dock_offset_m: 0.28
    dock_lateral_m: 0.0
    prop:
      type: shelf
      deck_height_m: 0.30    # top surface z; the package rests ON this
      size: [0.90, 0.40, 0.06]

  shelf_b:
    kind: pickup
    pose: { x: -3.0, y: 5.5, yaw: 1.5708 }
    dock_offset_m: 0.28
    dock_lateral_m: 0.0
    prop:
      type: shelf
      deck_height_m: 0.30
      size: [0.90, 0.40, 0.06]

  zone_a:
    kind: dropoff
    pose: { x: -4.5, y: 3.0, yaw: -1.5708 }  # facing -y, back toward open floor
    dock_offset_m: 0.28
    dock_lateral_m: 0.0
    prop:
      type: shelf
      deck_height_m: 0.30
      size: [0.90, 0.40, 0.06]

  zone_b:
    kind: dropoff
    pose: { x: -3.0, y: 3.0, yaw: -1.5708 }
    dock_offset_m: 0.28
    dock_lateral_m: 0.0
    prop:
      type: shelf
      deck_height_m: 0.30
      size: [0.90, 0.40, 0.06]

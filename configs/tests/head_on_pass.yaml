# A test case (simtest/spec.py has the schema; docs/testing.md the how-to).

name: head_on_pass
title: Something comes down the aisle head-on — pass it, don't collide, don't crawl
description: >
  robot_0 drives up its own aisle while something comes down the west half
  of it toward the robot and never yields: a person at 1 m/s (variant
  `person`) or a low warehouse AMR at 0.8 m/s (variant `amr`). The aisle is
  ~4 m wide, so passing on the east side is possible. Pass = no contact with
  a real margin, the goal reached, and the pass costing little: a detour of
  at most 1.6x the straight line. The reaction metric is reported, not
  judged — a clean pass need not slow down at all.

scenario: moving_obstacles_mapped
overrides:
  world: person_head_on

warmup_s: 5

goals:
  - robot: robot_0
    pose: [-7.4, 15.0, 1.5708]   # up the aisle, east side, level with the mover's turn point
    timeout_s: 120

stop:
  sim_s: 150
  until: [goals_done]
  settle_s: 3

metrics:
  - metric: clearance
    pass:
      contacts: {eq: 0}
      min_m: {gt: 0.10}
  - metric: goals
    pass:
      success_rate: {gte: 1.0}
      max_detour_ratio: {lte: 1.6}
  - metric: reaction
  - metric: detection
  - metric: prediction                # reported: the Kalman tracker's look-ahead error
  - metric: run_stats

variants:
  - label: person
    set: {overrides.world: person_head_on}
  - label: amr
    set: {overrides.world: amr_head_on}

record: [dyn, trk]
repeats: 1
pass_rate: 1.0

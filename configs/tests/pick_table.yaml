# A test case: one scored, repeatable question (simtest/spec.py has the full
# schema; docs/testing.md the how-to). Run it from the operator view's Tests tab, or:
#
#   scripts/simtest.py run pick_table
#
# The one to WATCH: start it from the Tests tab and follow it in the operator view's Sim
# view, over Tailscale if you like. Isaac runs headless, so nothing needs a local display.

name: pick_table
title: Pick and place — box on a table in front of the robot
section: Pick and place
description: >
  robot_0 starts facing a table with a box on it, the magnet plate toward the robot and
  in the head camera's view from the first frame. Pass = it found the plate with the
  camera, drove 0.47 m up to the table, picked the box with the magnet and set it down
  15 cm along the table, without dropping it. Scored from ground truth. The sim stays
  up 10 s after the box is down.

scenario: pick_bench
overrides: {world: pick_table, headless: true}

warmup_s: 2

tasks:
  - robot: robot_0
    package: pkg_0
    place: {shift: [0, -0.15]}     # 15 cm along the table

stop:
  sim_s: 240
  until: [tasks_done]
  settle_s: 10

metrics:
  - metric: pick_place
    pass:
      placed: {gte: 1}
      detected: {gte: 1}
      max_place_error_m: {lte: 0.15}
      max_place_z_error_m: {lte: 0.05}
      drops: {eq: 0}
      false_picks: {eq: 0}
  - metric: tasks
    pass:
      success_rate: {gte: 1.0}
  - metric: run_stats

repeats: 1
pass_rate: 1.0

# A test case: one scored, repeatable question (simtest/spec.py has the full
# schema; docs/testing.md the how-to). Run it from the operator view's Tests tab, or:
#
#   scripts/simtest.py run pick_table
#
# The one to WATCH: it opens Isaac's window (headless: false), which pick_place_smoke
# leaves closed to keep the rendering cost down. It needs a display on the sim's machine;
# on one without, run it with --set overrides.headless=true.

name: pick_table
title: Pick and place — box on a table in front of the robot
description: >
  robot_0 starts facing a table with a box on it, the magnet plate toward the robot and
  in the head camera's view from the first frame. Pass = it found the plate with the
  camera, drove 0.47 m up to the table, picked the box with the magnet and set it down
  15 cm along the table, without dropping it. Scored from ground truth. Isaac's window
  opens for this one, and stays up 10 s after the box is down.

scenario: pick_bench
overrides: {world: pick_table, headless: false}

warmup_s: 2

tasks:
  - robot: robot_0
    package: pkg_0
    place: {shift: [0, -0.15]}     # 15 cm along the table

stop:
  sim_s: 240
  until: [tasks_done]
  settle_s: 10

metrics:
  - metric: pick_place
    pass:
      placed: {gte: 1}
      detected: {gte: 1}
      max_place_error_m: {lte: 0.15}
      max_place_z_error_m: {lte: 0.05}
      drops: {eq: 0}
      false_picks: {eq: 0}
  - metric: tasks
    pass:
      success_rate: {gte: 1.0}
  - metric: run_stats

repeats: 1
pass_rate: 1.0

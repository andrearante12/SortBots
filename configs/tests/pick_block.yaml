# A test case: one scored, repeatable question (simtest/spec.py has the full
# schema; README.md §9 the how-to). Run it from the operator view's Tests tab, or:
#
#   scripts/simtest.py run pick_block
#
# Headless, so nothing needs a local display: follow it in the operator view (Split on the
# robot's camera and the Sim tab), over Tailscale if you like.

name: pick_block
title: Pick up the target block
section: Pick and place
description: >
  robot_0 starts in front of a table, facing the target block, with the block's magnet
  plate in the head camera's view from the first frame. All it has to do is pick the block
  up. Pass = the camera found the plate, the magnet took the block and still has it when
  the test ends. Scored from ground truth. The sim stays up 10 s afterwards.

scenario: pick_bench
overrides: {world: pick_table, headless: true}

warmup_s: 2

tasks:
  - robot: robot_0
    package: pkg_0
    find: geometry                 # no location in the work order: depth geometry finds the block
    place: hold

stop:
  sim_s: 180
  until: [tasks_done]
  settle_s: 10

metrics:
  - metric: pick_place
    pass:
      picked: {gte: 1}
      held_at_end: {gte: 1}
      detected: {gte: 1}
      drops: {eq: 0}
      false_picks: {eq: 0}
  - metric: tasks
    pass:
      success_rate: {gte: 1.0}
  - metric: run_stats

repeats: 1
pass_rate: 1.0

# A test case: one scored, repeatable question (simtest/spec.py has the full
# schema; docs/testing.md the how-to).
#
# Shelves are not all at one height. The arm's reach envelope is a band (TCP 0.65 to
# 1.29 m above the floor), and the lowest plates only work with the magnet tilted down
# onto them (nodes/arm_kin.py plan_reach). This asks for three heights across the
# band; the ones below it are pick_unreachable.

name: pick_heights
title: Three packages at three shelf heights
section: Pick and place
parked: true       # off the Tests tab for now; scripts/simtest.py still runs it
description: >
  Three decks, 0.70, 0.78 and 0.90 m high, each with a box whose plate faces north.
  Pass = all three picked and placed within 15 cm of the spot 12 cm to the west, at
  the deck's own height, none dropped.

scenario: pick_bench
overrides: {world: pick_heights}

warmup_s: 2

tasks:
  - {robot: robot_0, package: pkg_0, place: {shift: [-0.12, 0.0]}}    # 0.70 m deck
  - {robot: robot_0, package: pkg_1, place: {shift: [-0.12, 0.0]}}    # 0.78 m deck
  - {robot: robot_0, package: pkg_2, place: {shift: [-0.12, 0.0]}}    # 0.90 m deck

stop:
  sim_s: 520
  until: [tasks_done]
  settle_s: 3

metrics:
  - metric: pick_place
    pass:
      success_rate: {gte: 1.0}
      max_place_error_m: {lte: 0.15}
      max_place_z_error_m: {lte: 0.05}
      drops: {eq: 0}
      false_picks: {eq: 0}
      detected: {gte: 3}
      mean_detect_err_m: {lte: 0.05}
  - metric: tasks
    pass:
      success_rate: {gte: 1.0}
  - metric: run_stats

repeats: 2
pass_rate: 1.0

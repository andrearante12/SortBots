# A test case (simtest/spec.py has the schema; docs/testing.md the how-to).

name: cluttered_route
title: Two-leg route through clutter and two walkers
description: >
  robot_0 leaves its aisle for the far west of the open floor, then cuts back
  south-east past a crate, a barrel row and a pallet stack, crossing both
  walkers' paths on the way. Static and dynamic avoidance in one run: the
  crates have to be mapped and planned around, the walkers have to be avoided
  and NOT mapped. Scored with two clearance metrics — actors and props — so a
  scrape against a crate reads differently from a walker collision.

scenario: moving_obstacles_mapped
overrides:
  world: cluttered_floor

warmup_s: 5

goals:
  - robot: robot_0
    pose: [-12.0, 5.8, 3.1416]   # west, between walker A's line and crate_2
    timeout_s: 150
  - robot: robot_0
    pose: [-11.0, -0.5, -1.5708] # south, past the barrels and through walker B's loop
    timeout_s: 150

stop:
  sim_s: 360
  until: [goals_done]
  settle_s: 3

metrics:
  - metric: clearance
    pass:
      contacts: {eq: 0}
  - metric: clearance
    id: clearance_props
    params: {actors: [], props: true}
    pass:
      contacts: {eq: 0}
  - metric: goals
    pass:
      success_rate: {gte: 1.0}
  - metric: map_contamination
    pass:
      occupied_frac: {lte: 0.05}
  - metric: run_stats

repeats: 1
pass_rate: 1.0

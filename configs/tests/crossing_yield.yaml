# A test case: one scored, repeatable question (simtest/spec.py has the full
# schema; docs/testing.md the how-to). Run it with:
#
#   scripts/simtest.py run crossing_yield                # both variants
#   scripts/simtest.py run crossing_yield --variant person
#
# Coordinates are the map frame (== Isaac world). Thresholds are a first cut:
# tighten them once a few runs show where the stack actually sits.

name: crossing_yield
title: Something crosses the route — see it, yield, arrive
description: >
  robot_0 drives from its spawn pose down its aisle and out onto the open
  floor while something crosses its route: a person pacing across the aisle
  mouth (variant `person`), or a forklift working the apron at 2 m/s
  (variant `forklift`). With the goal sent at t0 the robot reaches the
  crossing line ~13-15 sim-s in, so on a typical run they meet. Pass = no
  contact, the goal reached, the mover not painted into the map, and the
  robot visibly reacting: at least one encounter in which it halves its
  speed within 3 s of the mover becoming a threat.

scenario: moving_obstacles_mapped
overrides:
  world: person_crossing

warmup_s: 5

goals:
  - robot: robot_0
    pose: [-8.0, 3.0, -1.5708]   # out on the open floor, facing south
    timeout_s: 120

stop:
  sim_s: 150
  until: [goals_done]
  settle_s: 3

metrics:
  - metric: clearance
    pass:
      contacts: {eq: 0}
      min_m: {gt: 0.05}
  - metric: goals
    pass:
      success_rate: {gte: 1.0}
  - metric: map_contamination
    pass:
      occupied_frac: {lte: 0.05}
  - metric: reaction
    pass:
      encounters: {gte: 1}
      max_time_to_slow_s: {lte: 3.0}
  - metric: detection                 # reported: the frame-difference filter's recall
  - metric: prediction                # reported: the Kalman tracker's look-ahead error
  - metric: run_stats

variants:
  - label: person
    set: {overrides.world: person_crossing}
  - label: forklift
    set: {overrides.world: forklift_crossing}

record: [dyn, trk]
repeats: 1
pass_rate: 1.0

# A test case (simtest/spec.py has the schema; docs/testing.md the how-to).

# In detail (the description below is what the Tests tab shows):
#
#   robot_0 drives from its spawn pose down its aisle and out onto the open
#   floor while something crosses its route: a person pacing across the aisle
#   mouth (variant `person`), or a forklift working the apron at 2 m/s
#   (variant `forklift`). With the goal sent at t0 the robot reaches the
#   crossing line ~13-15 sim-s in, so on a typical run they meet. Pass = no
#   contact, the goal reached, the mover not painted into the map, detected
#   while in view, and the robot visibly reacting: at least one encounter in
#   which it halves its speed within 3 s of the mover becoming a threat.
#   Live 2026-11-06 (person): FAILS on contact with prediction off and on;
#   docs/testing.md.

name: crossing_yield
title: Something crosses the route — see it, yield, arrive
section: Obstacle avoidance
description: A person, or a forklift, crosses the robot's route out of the aisle, and the robot has to give way and carry on.

scenario: moving_obstacles_mapped
overrides:
  world: person_crossing

warmup_s: 5

goals:
  - robot: robot_0
    pose: [-8.0, 3.0, -1.5708]   # out on the open floor, facing south
    timeout_s: 120

stop:
  sim_s: 150
  until: [goals_done]
  settle_s: 3

metrics:
  - metric: clearance
    pass:
      contacts: {eq: 0}
      min_m: {gt: 0.05}
  - metric: goals
    pass:
      success_rate: {gte: 1.0}
  - metric: map_contamination
    pass:
      occupied_frac: {lte: 0.05}
  - metric: reaction
    pass:
      encounters: {gte: 1}
      max_time_to_slow_s: {lte: 3.0}
  - metric: detection
    pass:
      recall: {gte: 0.3}
  - metric: prediction                # reported: the Kalman tracker's look-ahead error
  - metric: run_stats

variants:
  - label: person
    set: {overrides.world: person_crossing}
  - label: forklift
    set: {overrides.world: forklift_crossing}

record: [dyn, trk]
repeats: 1
pass_rate: 1.0

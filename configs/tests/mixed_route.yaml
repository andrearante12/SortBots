# A test case (simtest/spec.py has the schema; docs/testing.md the how-to).

name: mixed_route
title: Two-leg route through pallets, barrels, two people and a forklift
description: >
  robot_0 leaves its aisle for the west of the open floor, between the
  crossing person's line and the crates, then cuts back south past the
  crates, the barrels and the pallet, through the worker's loop, with the
  forklift working its lane to the west. Static and dynamic avoidance in one
  run: the props have to be mapped and planned around, the movers avoided
  and NOT mapped. Scored with two clearance metrics — actors and props — so
  a scrape against a crate reads differently from walking into someone.

scenario: moving_obstacles_mapped
overrides:
  world: warehouse_mixed

warmup_s: 5

goals:
  - robot: robot_0
    pose: [-11.5, 5.8, 3.1416]   # west, between the person's line and the crates
    timeout_s: 150
  - robot: robot_0
    pose: [-11.0, -0.5, -1.5708] # south, past the barrels and through the worker's loop
    timeout_s: 150

stop:
  sim_s: 360
  until: [goals_done]
  settle_s: 3

metrics:
  - metric: clearance
    pass:
      contacts: {eq: 0}
  - metric: clearance
    id: clearance_props
    params: {actors: [], props: true}
    pass:
      contacts: {eq: 0}
  - metric: goals
    pass:
      success_rate: {gte: 1.0}
  - metric: map_contamination
    pass:
      occupied_frac: {lte: 0.05}
  - metric: reaction
  - metric: run_stats

repeats: 1
pass_rate: 1.0

# Tuning for nodes/map_merge.py — fuses each robot's own RTAB-Map grid
# (/{robot_id}/map, frame {robot_id}/map) into one world-anchored grid
# (/map, frame map) via the static map -> {robot_id}/map anchors published
# in launch/sortbots_bringup.launch.py.
#
# Plain top-level keys, loaded by this node's own yaml.safe_load — matches
# configs/explorer.yaml's convention, not ROS 2's rcl_yaml_param_parser.

# How often to re-fuse and publish /map.
publish_period_s: 1.0

# Occupied/free classification threshold, matching nav2_params.yaml's
# inflation_layer / nodes/explorer.py's occupied_thresh convention: a cell
# value >= this counts as occupied when resolving priority ties between two
# robots' grids that disagree about the same world cell.
occupied_thresh: 50

# The fused grid always reaches at least this far around every robot's spawn
# (configs/robots.yaml, passed by the bringup as --keep-in), as unknown space
# where no robot has mapped. Nav2's global costmap is sized to /map, and a
# robot standing outside it fails every plan with "Start Coordinates ... was
# outside bounds". On a saved map extended by a fleet (shared_map), a robot
# spawned where the map's builder never looked stays read-only until it
# recognises a mapped place (nodes/map_handoff.py), so it adds nothing to
# /map and could never get inside: robot_1 and robot_3 sat at their spawns
# for a whole 4-robot run on fleet_warehouse_test (2026-10-25). Padded,
# they plan through unknown space (planner allow_unknown) toward the map.
spawn_margin_m: 4.0

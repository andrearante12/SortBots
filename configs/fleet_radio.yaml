# Mesh-shaped fleet radio (sim: ROS 2 topics; later: WiFi mesh transport).
# Consumed by nodes/fleet_radio.py (status broadcaster) and nodes/explorer.py
# (intent + peer keepouts). Autonomy nodes must NOT look up peer poses on
# shared /tf — status is self-reported over this channel instead.

status_hz: 5.0
# Drop a peer's last status if older than this (wall/monotonic in the
# receiver). Stale pose is worse than no pose for keepouts.
status_ttl_s: 1.0

# Intent keepalive while a goal is live (explorer also republishes on every
# replan tick). Late joiners use TRANSIENT_LOCAL on /fleet/intent.
intent_keepalive_s: 2.0
# Backstop if a peer vanishes without released:true.
intent_ttl_s: 90.0

# Soft exclusion radii (explorer). claim_radius applies to peer goal;
# peer_avoid_radius to last-heard status pose; corridor_radius to each
# polyline vertex on a peer's reserved corridor.
claim_radius_m: 1.0
peer_avoid_radius_m: 0.8
corridor_radius_m: 0.6

# Courtesy yield: if a peer's corridor intersects ours and their priority
# is >= ours, pause sending a new Nav2 goal for yield_wait_s (or until the
# peer releases). priority is robot index by default (robot_0 = 0 wins ties
# when equal — lower number = higher priority).
yield_enabled: true
yield_wait_s: 3.0

# Only test the leading yield_horizon_m of our own route for conflicts, not
# its whole length. Exploration goals are 10-12 m out, and a line that long
# crosses most of the warehouse, so it conflicts with SOME peer corridor
# almost always — see nodes/fleet_radio.py's should_yield() for the live
# failure this prevents.
yield_horizon_m: 3.0
# Hard cap on how long we defer to ONE peer intent. A yield is a courtesy for
# a crossing that clears in seconds; priority here is STATIC (robot index), so
# without a cap the lower-priority robot re-loses the same check every time
# yield_wait_s lapses and never explores at all. After this long we proceed
# and stop yielding to that same peer goal — Nav2's local costmap and
# collision_monitor are what actually keep the robots off each other; this
# channel only exists to stop them choosing overlapping work. Budget restarts
# when the peer picks a different goal. 0 disables the cap (not recommended).
yield_max_total_s: 12.0

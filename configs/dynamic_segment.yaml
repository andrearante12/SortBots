# nodes/dynamic_segment.py — open-vocab detector + SAM masks of movers, for the
# depth filter to strip from depth_static (docs/mapping-movers.md).
# Top-level keys apply everywhere; the `sim:` / `real:` block is laid over them.

# Frames per second the models run on (wall clock, steady). RTAB-Map takes a
# keyframe at ~2 Hz, so anything above that is margin for seg_policy: open,
# whose depth frames use the newest mask. Bounded by the Orin Nano budget.
# 3, not 5 (2026-11-20): with Nav2 up the Orin sat at load 23; 3 still covers RTAB-Map's 2 Hz,
# and the depth filter's seg_max_age_s (0.5) is set for this rate.
rate_hz: 3.0

# Class lists live in seg_tracks.DEFAULTS too; these override them. The
# detector's vocabulary is BAKED INTO the exported engine (YOLO-World
# set_classes before export), so changing a list means re-running
# scripts/dynamic_seg_models.sh export. Every name here must be in the export.
always: [person, forklift, pallet jack, robot]
if_moving: [box, cart, pallet, trolley, bin]

score_min: 0.25
nms_iou: 0.5
max_prompts: 8
track_ttl_s: 10.0
blob_max_age_s: 0.5     # motion/conflict blobs older than this vs the rgb frame are ignored

detector:
  model: models/yolo_world.onnx    # the class list in the same order as the export
  classes: [person, forklift, pallet jack, robot, box, cart, pallet, trolley, bin]
  size: 640
segmenter:
  # NanoSAM with the PPHGV2-B1 encoder (huggingface.co/dragonSwing/nanosam,
  # sam_hgv2_b1_ln_nonorm_image_encoder.onnx, Apache-2.0): faster and more
  # accurate than the ResNet18 one, whose Drive link now wants a sign-in
  # (2026-11-20). The decoder is MobileSAM's, from the same repo.
  encoder: models/nanosam_encoder.onnx
  decoder: models/nanosam_decoder.onnx
  size: 1024          # the decoder's frame (SAM's): prompts and masks are in it
  encoder_size: 512   # B1 takes 512 (same 64x64 embedding); ResNet18 took 1024
  normalize: false    # a "nonorm" export wants raw 0-255; ResNet18 wanted SAM's mean/std

sim:
  # The desktop has a GPU but no TensorRT engines unless built there; ort
  # with the CUDA provider if onnxruntime-gpu is installed, else CPU (slow).
  backend: ort
real:
  # The engines run on the Jetson HOST (scripts/dynamic_seg_server.py, started by
  # scripts/jetson.sh seg start): the Jazzy container has no TensorRT. Built there
  # from the ONNX files above (scripts/dynamic_seg_models.sh engines).
  backend: remote
  remote: {host: 127.0.0.1, port: 7311}

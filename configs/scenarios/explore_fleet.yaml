# Scenario definition for the dashboard's Scenarios tab — see the header of
# configs/scenarios/explore_fresh.yaml for the schema and the rationale behind
# the `run:` allowlist.

name: explore_fleet

title: Frontier exploration — fleet (2 robots)
description: >
  Two robots, spawned at their configs/robots.yaml positions in the NVIDIA
  warehouse, exploring collaboratively from empty maps. Each robot's own
  RTAB-Map grid is fused into one world-anchored /map (nodes/map_merge.py) via
  static map -> <robot_id>/map anchors, so both explorers plan frontiers
  against space EITHER robot has mapped — not two independent single-robot
  runs sharing a warehouse. Frontier claims (see nodes/explorer.py) keep them
  from repeatedly targeting the same cluster. Only robot_0 gets a chase cam
  (dashboard shows that feed); robot_1 skips the cosmetic render product so
  the GPU isn't saturated by a second 3rd-person view nobody is watching.
  Override chase_cam_robots=2 if you need both, or =0 / chase_cam:false to
  drop them entirely.

status: ready

run:
  scene: nvidia
  robots: 2              # robot_ids derives from this, in configs/robots.yaml order
  robot_id: robot_0      # which robot --localize/--resume/--map/--teleop would apply to
  headless: false
  chase_cam: true
  chase_cam_robots: 1    # only robot_0 — saves one render product vs both
  explore: true
  resume: false
  localize: false
  teleop: false
  map: null

# `robots` is deliberately NOT overridable here — it must stay in lockstep
# with robot_ids (left unset above so run_demo.sh derives it FROM robots), and
# a scenario named "fleet" that silently ran as 1 robot would be confusing.
# Use explore_fresh for the single-robot case.
overrides: [headless, resume, chase_cam_robots]

capture:
  bag: false

# A world layout (simtest/world.py has the full schema). Coordinates as in
# person_crossing.yaml: robot_0's aisle opens south onto clear floor at y ~ 8.
#
# The "mapped twice" case. A person stands at the aisle mouth from t = 0,
# walks 2 m east, stands there again for 15 s, then walks on across robot_0's
# route and keeps standing at the far end (mode: once holds it). Frame
# differencing sees them only while they walk; standing still they used to
# get painted into the map at every place they stopped. dwell_s applies
# before EVERY leg, which is what makes the two stops.

name: walk_stop_walk
title: Aisle mouth — a person stands, walks, stands again, walks on
description: >
  A person stands at the aisle mouth, walks 2 m, stands for 15 s, then walks
  across robot_0's route and stops at the far side. Mapping with them in view
  is the case that maps a person twice: scores whether they reach /map and
  the 3D reconstruction at all.

scenes: [nvidia]
autostart: true

actors:
  - id: person_0
    label: person
    preset: person
    path:
      waypoints: [[-12.0, 6.5], [-10.0, 6.5], [-5.5, 6.5]]
      speed_mps: 1.0
      mode: once
      start_at_s: 0.0
      dwell_s: 15.0      # 0-15 s at the first point, 17-32 s at the second

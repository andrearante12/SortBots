version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    groups:
      dev-deps: {patterns: ["*"]}
  - package-ecosystem: docker
    directory: /docker/jetson
    schedule: {interval: monthly}
  - package-ecosystem: docker
    directory: /docker/slam_bench
    schedule: {interval: monthly}

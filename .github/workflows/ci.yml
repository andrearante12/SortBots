name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 7 * * *"     # nightly: also exercises the real git-lfs maps
  workflow_dispatch:

# A newer push to the same PR supersedes the run in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  offline:
    # Fast, ROS-free, GPU-free checks: lint, shellcheck, byte-compile of every
    # node/launch/script, pure-python tests (fails on unexpected skips), scenario
    # and scored-test validation against synthetic fixture maps, and the headless
    # dashboard test in chrome. The sim itself (Isaac / ManiSkill / ROS 2 launch,
    # tests/isaac/) needs a GPU + display and can never run on a hosted runner.
    runs-on: ubuntu-24.04   # native Python 3.12, matches the dev machine
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        # XLeRobot submodule is Isaac-track only; skip it for speed.

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Guard — ROS must not be sourced
        # session.py / run_demo.sh exit 1 when AMENT_PREFIX_PATH is set. A clean
        # runner satisfies this for free; fail loudly if that ever changes.
        run: test -z "$AMENT_PREFIX_PATH"

      - run: make deps PYTHON=python3

      - name: make ci
        # lint, shellcheck, compile, test, smoke, simtest-validate, web-test.
        # CI=true makes the dashboard test pass --no-sandbox to the runner's
        # preinstalled google-chrome.
        run: make ci PYTHON=python3
        env:
          CHROME_BIN: /usr/bin/google-chrome

      - name: Keep junit on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit
          path: .pytest-junit.xml
          if-no-files-found: ignore

  cad:
    # tests/cad_test.py is skipped in `offline` (cadquery lives in its own venv
    # locally). Here it is installed straight into the runner's python.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hardware/requirements-cad.txt
      - run: make cad-ci PYTHON=python3
        # SO101_Assembly.step is a network fetch (hardware/setup_cad.sh) and
        # those three tests skip without it; everything else must run.

  workflows:
    # Lint the workflow files themselves — a typo here otherwise only shows up as
    # a job that silently never runs.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: raven-actions/actionlint@v2

  docker-jetson:
    # Builds the robot image (ros:jazzy userspace, same as the Jetson) and runs,
    # inside it: every launch file's argument parse (`ros2 launch -s` imports
    # the file and builds the description) and the pytest suite WITH rclpy, so
    # the importorskip'd node tests (station_dock_test etc.) actually run.
    #
    # continue-on-error until it has been green once on a runner: this job needs
    # apt + the ros image and could not be run where it was written. Remove the
    # flag after the first pass.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build robot image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/jetson/Dockerfile
          load: true
          push: false
          tags: sortbots-jetson:ci
          cache-from: type=gha,scope=jetson
          cache-to: type=gha,scope=jetson,mode=max
      - name: Launch files parse under Jazzy
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo sortbots-jetson:ci bash -c '
            set -e
            source /opt/ros/jazzy/setup.bash
            for f in launch/*.launch.py; do
              echo "== $f"
              ros2 launch -s "./$f" >/dev/null
            done'
      - name: pytest with rclpy available
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo sortbots-jetson:ci bash -c '
            set -e
            source /opt/ros/jazzy/setup.bash
            apt-get update -qq && apt-get install -y -qq python3-pytest >/dev/null
            python3 scripts/make_fixture_maps.py /tmp/maps
            SORTBOTS_MAPS_DIR=/tmp/maps python3 -m pytest -rs'

  docker-slam-bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true      # same reason as docker-jetson
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/slam_bench/Dockerfile
          push: false
          cache-from: type=gha,scope=slam-bench
          cache-to: type=gha,scope=slam-bench,mode=max

  lfs-maps:
    # Nightly only: the committed tests against the REAL library maps instead of
    # the synthetic stand-ins, so a missing/corrupt/pointer-only map is caught
    # even when no PR touches it.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: make deps PYTHON=python3
      - name: Every saved map verifies
        # No maps in the tree (they are not committed on every branch) is not a
        # failure of THIS job; the validate step below is what names a missing one.
        if: hashFiles('maps/*/map.json') != ''
        run: |
          for d in maps/*/; do
            n=$(basename "$d")
            python3 scripts/maps_lib.py verify "$n"
          done
      - name: Scored tests validate against the real maps
        if: hashFiles('maps/*/map.json') != ''
        run: python3 scripts/simtest.py validate
        env:
          SORTBOTS_MAPS_DIR: ${{ github.workspace }}/maps

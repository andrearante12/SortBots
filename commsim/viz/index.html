<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>commsim replay</title>
<!--
  Packet-transfer replay for the commsim emulation. Loads one trace
  (commsim/viz/build_trace.py) and plays it back: robots on the floor, SNR
  links, batman next-hop routes, every frame as a dot travelling its hop,
  drops flashed, link blocks, and each robot's view of who is silent.

  Vanilla JS + canvas, no build step, no libraries (same stack as webui/).
  Open via a static server (`python3 -m http.server` at the repo root, then
  /commsim/viz/index.html?trace=/commsim/results/<run>/trace.json) or as a
  file:// page and drop the trace onto it — file:// cannot fetch, which is
  why both paths exist.
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0e1013; color: #cde; font: 13px/1.4 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  #bar { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-bottom: 1px solid #2a2e35; flex-wrap: wrap; }
  #bar h1 { font-size: 14px; margin: 0 6px 0 0; font-weight: 600; }
  #name { font-family: monospace; color: #9aa; }
  button, select, input[type=file] { background: #1c1f24; color: #cde; border: 1px solid #2a2e35; border-radius: 4px; padding: 3px 8px; font: inherit; }
  button:hover { background: #262a31; }
  #time { font-family: monospace; min-width: 11ch; }
  #drop { color: #667; font-size: 12px; }
  #main { flex: 1 1 auto; display: grid; grid-template-columns: 1fr 300px; min-height: 0; }
  #floor { width: 100%; height: 100%; display: block; background: #0e1013; }
  #floorwrap { position: relative; min-height: 0; }
  #legend { position: absolute; left: 10px; bottom: 8px; display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: #9aa; pointer-events: none; }
  #legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; background: var(--c); vertical-align: -1px; }
  #side { border-left: 1px solid #2a2e35; padding: 8px 10px; overflow: auto; font-size: 12px; }
  #side h2 { font-size: 12px; margin: 6px 0 4px; color: #9aa; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  #side table { border-collapse: collapse; width: 100%; font-family: monospace; font-size: 11px; }
  #side td, #side th { padding: 2px 4px; text-align: left; border-bottom: 1px solid #1c1f24; white-space: nowrap; }
  #side th { color: #778; font-weight: 600; }
  #side tr.silent td { color: #f77; }
  #side .limits { color: #778; font-size: 11px; white-space: pre-wrap; }
  #controls { display: flex; align-items: center; gap: 12px; padding: 4px 10px; border-top: 1px solid #2a2e35; flex-wrap: wrap; font-size: 12px; color: #9aa; }
  #controls label { display: inline-flex; align-items: center; gap: 3px; }
  #timeline { width: 100%; height: 56px; display: block; cursor: pointer; }
  #hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #556; font-size: 14px; pointer-events: none; }
  #tour { display: flex; gap: 6px; padding: 4px 10px; border-top: 1px solid #2a2e35; overflow-x: auto; font-size: 11px; }
  #tour:empty { display: none; }
  #tour button { white-space: nowrap; padding: 2px 8px; font-size: 11px; border-color: #9d4edd; }
  #caption { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); max-width: 70%; background: #1c1f24; border: 1px solid #9d4edd; border-radius: 6px; padding: 8px 14px; font-size: 13px; pointer-events: none; display: none; }
  @media (max-width: 800px) { #main { grid-template-columns: 1fr; } #side { border-left: 0; border-top: 1px solid #2a2e35; max-height: 35vh; } }
</style>
</head>
<body>
  <div id="bar">
    <h1>commsim replay</h1>
    <span id="name">no trace</span>
    <input type="file" id="file" accept=".json,.gz,application/json,application/gzip">
    <span id="drop">or drop a trace.json(.gz) anywhere</span>
    <button id="play" title="space">▶</button>
    <button id="prev" title="previous event (link, silence)">⏮ event</button>
    <button id="next" title="next event (link, silence)">event ⏭</button>
    <select id="speed" title="replay speed">
      <option value="0.1">0.1×</option><option value="0.25">0.25×</option><option value="0.5">0.5×</option>
      <option value="1" selected>1×</option><option value="2">2×</option><option value="5">5×</option><option value="10">10×</option>
    </select>
    <span id="time">0.000 s</span>
  </div>
  <div id="main">
    <div id="floorwrap">
      <canvas id="floor"></canvas>
      <div id="hint">load a trace to begin</div>
      <div id="caption"></div>
      <div id="legend"></div>
    </div>
    <div id="side"><h2>Fleet</h2><div id="side-body">—</div></div>
  </div>
  <div id="tour" title="guided tour: the moments worth seeing, in order"></div>
  <div id="controls">
    <span>routes:</span>
    <select id="routes">
      <option value="gateway" selected>every robot → gateway</option>
      <option value="selected">from selected node</option>
      <option value="none">none</option>
    </select>
    <span>show:</span><span id="filters"></span>
  </div>
  <canvas id="timeline"></canvas>
  <script src="viz.js"></script>
</body>
</html>

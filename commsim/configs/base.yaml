# commsim base configuration. Layered: base -> variant -> layout -> scenario
# -> sweep (+ seed). Every value tagged `placeholder` or `estimate` is a
# parameter awaiting measurement, NOT a fact — see docs/plan.md §4 for which
# hardware test replaces it. Nothing here is shared with the Isaac track.

# One fleet list generates every node's addresses, radio MACs, zenohd config
# and Cyclone peer list (core/fleet.py). Our own subnet; never campus/eduroam.
fleet:
  subnet: 10.42.0.0/24          # placeholder: team picks the real one
  zenoh_port: 7447
  gateway_id: 0                 # robot_id 0 is the gateway (uint8 on the wire)
  robots: 5                     # robot_id 1..robots; sweeps override this
  bands: [g24, g5]              # V1-V3 use only g24; V4+ add g5 to bat0

radio:
  g24: {channel: 1, width_mhz: 20}        # placeholder: open question 3
  g5:  {channel: 36, width_mhz: 20}       # placeholder: non-DFS assumed
  mesh_id: sortbots-mesh
  mtu: 1532                     # 1500 + 32 B batman-adv header
  multicast_rate_mbps: 12
  legacy_b_rates: false
  sae: true

batman:
  algo: BATMAN_IV
  # 250 ms (design said 500; batman default 1000). Measured worst-case recovery
  # on a longer detour: 3.0 s @250, 5.67 s @500, 10.3 s @1000 (sim_log step 19).
  # With worst-case reroute, DES scenario passes went 71 -> 100 / 120 (TCP
  # Status) for ~2x OGM airtime (~8% -> 16% of a busy-21% channel at n=15).
  orig_interval_ms: 250
  hop_penalty: default

zenoh:
  # Ordering (core/timers.py checks it): reroute < Status resume after a
  # reroute (TCP backoff) < transport lease < status timeout < task lease.
  # 2 s (first value) sat 50 ms above the measured 1.95 s reroute; sessions
  # churned during reroutes. rmw_zenoh's own default is 60 s.
  transport_lease_ms: 4000
  keep_alive: 4                 # zenoh default ratio: lease / keep_alive
  shared_memory: false          # namespaces share /dev/shm — never let SHM cross robots
  # Who dials whom. "lower_id": a router dials only peers with a lower
  # robot_id, so each pair has ONE TCP session. "all" (spec as written) made
  # both ends dial: two sessions per pair, one idling on keepalives — about
  # half the airtime at n=10 (sim_log finding 6, measured in emulation M1).
  connect: lower_id

protocol:
  status_hz: 3.0                # placeholder
  gateway_status_hz: 1.0
  status_timeout_s: 6.0         # spec ~3 s; raised — see core/timers.py and sim_log step 14
  task_lease_s: 10.0
  reclaim_margin_s: 2.0         # placeholder
  bid_window_s: 1.0
  bid_radius_m: 15.0            # placeholder: open question 4
  rebid_delay_s: [0.2, 1.0]     # uniform random delay before a no-winner rebid
  rebid_radius_growth: 2.0      # placeholder: each no-winner round widens the radius
  rebid_max_rounds: 3           # after this, radius is unlimited
  max_owned_tasks: 1
  lease_beacon_hz: 1.0          # fleet-wide lease renewal (0 = spec as written)
  # At most this many open bids per robot. 0 = unlimited (spec). In a 30-task
  # burst at n=15 unlimited bidding stormed the channel (control p95 up to
  # 6.5 s); 3 passed 40/40 bursts with no cost at normal or heavy load.
  max_open_bids: 3
  # Subscriber KEEP_LAST depth for shared status topics. Depth 1 dropped 15%
  # of statuses in emulation: the queue is per subscription, not per publisher.
  status_qos_depth: 32
  # "udp" (ADOPTED 2026-10-04): best-effort UDP unicast over bat0 — batman
  # still routes it multi-hop, but no TCP ACK / retransmit / backoff. vs TCP:
  # failure scenarios 100 -> 110/120, +2 robots capacity, link-loss Status gap
  # 3.5 -> 3.0 s on the real stack, 0.89 vs 0.35 delivery when overloaded
  # (sim_log steps 20-22). "tcp" = Status over zenoh like everything else.
  status_transport: udp
  status_udp_port: 7450
  hold_safe_timeout_s: 15.0     # placeholder: open question 4
  staleness_threshold_s: 1.0    # placeholder: flag only, not a failure criterion

# Approximate payload sizes (bytes) for the DES until M1 measures the CDR
# serialized size of each commsim_msgs type. estimate — from the design table.
message_bytes:
  TaskAnnounce: 40
  Bid: 20
  Claim: 24
  TaskEvent: 18
  Status: 150
  ObstacleEvent: 32
  MapResync: 12
  Emergency: 16
  LinkHealth: 50
  MapUpdate_chunk_max: 8192

map:
  update_period_s: [2.0, 5.0]   # placeholder
  rate_cap_kbps: 100            # placeholder, per robot
  full_refresh_s: 60.0          # placeholder

background:
  busy_share: {g24: 0.0, g5: 0.0}   # swept 0 / 0.15 / 0.30
  congested_g24: false

# Measured values that constrain the design (not tunables). Source in sim_log.
measured:
  reroute_s: 1.95               # batman-adv, emulation diamond, OGM 500 ms and 250 ms
  status_resume_after_reroute_s: 3.7   # real stack, TCP Status, max gap after link block
  # Worst per-direction recovery when the detour is LONGER than the lost link
  # (3-hop detour around a blocked direct link), by OGM interval, emulation:
  reroute_worst_s: {250: 3.0, 500: 5.67, 1000: 10.33}
  # Worst Status gap on the real stack for that longer-detour link loss:
  status_gap_worst_s:
    tcp: {250: 3.54}
    udp: {250: 3.0, 500: 5.67, 1000: 10.33}

# Real routers and hosts only (commsim/hw/deploy.py); the emulation and DES
# ignore this section.
hardware:
  # Regulatory domain. placeholder: wrong value = wrong channels/tx power.
  country: US
  # Routers bridge their Ethernet port into bat0; the Jetson/laptop behind it
  # holds the fleet IP above. Each router also gets a management IP counted
  # down from the top of the subnet: gateway router .254, robot_1's .253, ...
  router_mgmt_ip_top: true
  # Ethernet port on each host that plugs into its router. placeholder:
  # enP8p1s0 is the Jetson Orin Nano devkit name; check `ip link` on yours.
  robot_iface: enP8p1s0
  gateway_iface: eth0           # placeholder: the operator laptop's port
  htmode: HT20                  # 20 MHz, matches the model and emulation

run:
  warmup_s: 60
  steady_s: 300
  seed: 1
  cpu_guard_pct: 80             # placeholder: emulation run invalid above this

# Lab hardware: 2 robots + gateway, over base.yaml:
#   python3 -m commsim.hw.deploy commsim/configs/base.yaml commsim/configs/hw_lab.yaml \
#       --mesh-key-file ~/.config/sortbots/mesh.key --out commsim/results/hw
# Dual band = the V4 setup. Brought up on 2.4 GHz alone first (V3, docs/commsim.md
# step 6); g5 added 2026-11-09 once the 2.4 GHz mesh was confirmed, because the
# lab's channel 1 is 25-36% busy with campus networks before the fleet sends
# anything (channel 6 was 40-47%, 11 26-30%: no quieter 2.4 GHz channel to move to).
fleet:
  robots: 2
  bands: [g24, g5]

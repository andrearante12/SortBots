# DRAFT for review (A6, 2026-11-26). Benchmark: a MIXED fleet on the open
# floor. Three robot types: standard (the rest), fast (30 %: 0.75 m/s) and
# heavy (20 %: the only ones that can lift a heavy package, slower at
# 0.4 m/s, and 8 s to pick, 5 s to place). A fifth of the tasks need a heavy
# robot. Tests whether a method gives each task to the robot that delivers it
# soonest (a fast robot from a little further away beats a standard one
# beside the shelf) and keeps the scarce heavy robots for the work only they
# can do.
#
# Regime: rate_per_robot_hz 0.004, about 0.65 of a standard robot's capacity
# (bench_steady's header), so the fleet as a whole keeps up, but the heavy
# tasks alone ask about three quarters of what the heavy robots can deliver:
# a method that sends them standard work makes heavy tasks wait. The types
# are shares, so they scale with --robots: 2 robots = 1 fast + 1 heavy,
# 5 = 2 standard + 2 fast + 1 heavy, 10 = 5 + 3 + 2, 20 = 10 + 6 + 4.
# Arrivals stop at 1200 s and the run goes on to 1500 s, as in bench_steady.
# Network: ideal. The question is assignment across robot types, not comms.
# Measured (seeds 1-3, auction / central_greedy / central_hungarian): see
# docs/fleetsim.md "Robot types and capabilities".
name: bench_mixed
title: "DRAFT bench: mixed fleet, fast and heavy types (delivery time)"
description: >
  The default synthetic warehouse, true map, a fleet of standard, fast and
  heavy robots, and a Poisson task stream at 0.004 tasks per robot per second
  from t=0 to 1200 s, any shelf to any dock, a fifth of them needing a heavy
  robot. Run for a fixed 1500 s.
seed: 1
duration_s: 1500
robots: 10
config:
  map_share: {prior: truth}
  robots:
    types:
      - {name: standard}
      - {name: fast, share: 0.3, max_speed_mps: 0.75, accel_mps2: 0.75}
      - {name: heavy, share: 0.2, capabilities: [heavy], max_speed_mps: 0.4, accel_mps2: 0.3,
         pick_s: 8, place_s: 5}
task_arrival: {rate_per_robot_hz: 0.004, pickups: "shelf_*", dropoffs: "dock_*", until_s: 1200,
               requires: {heavy: 0.2}}
metrics:
  - metric: fleet_tasks
  - metric: bounds
  - metric: utilisation
  - metric: contacts
  - metric: nav
    pass: {empty_shelf: {eq: 0}}

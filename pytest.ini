[pytest]
# commsim/tests = the fleet comms simulation (offline: PyYAML only, no ROS)
testpaths = tests commsim/tests
# tests/isaac/ needs a headless GPU + the Isaac venv (python3.11); collection
# succeeds but the fixtures blow up with `No module named 'isaacsim'`. Keep it
# out of the default run — CI and a bare `pytest` must stay GPU-free.
norecursedirs = tests/isaac
addopts = -q

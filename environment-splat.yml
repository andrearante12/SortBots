# Gaussian-splat trainer (splat/, scripts/splat.sh). Its own env, never mixed
# with lerobot, the Isaac venv, or system ROS 2 — see docs/real-robot.md
# "Gaussian splats". The package list (and why it is pinned) is
# requirements-splat.txt, shared with the uv install for machines without conda.
name: splat
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10
  - pip
  - pip:
      - -r requirements-splat.txt
